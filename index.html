<!DOCTYPE html>
<html lang="ms" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PintarBio - Aplikasi Pembelajaran Biologi SPM (KSSM)</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            bio: {
              50: '#f0fdf4',
              100: '#dcfce7',
              200: '#bbf7d0',
              300: '#86efac',
              400: '#4ade80',
              500: '#22c55e',
              600: '#16a34a',
              700: '#15803d',
              800: '#166534',
              900: '#14532d',
            },
            accent: {
              blue: '#2563eb',
              cyan: '#06b6d4',
            }
          },
          fontFamily: {
            sans: ['Poppins', 'Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      user-select: none;
    }
    .card-shadow {
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
    }
    .no-select {
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-slate-900 dark:text-slate-100 min-h-screen flex flex-col transition-colors duration-300">

  <!-- TOP HEADER / NAVBAR -->
  <header class="sticky top-0 z-50 bg-white/90 dark:bg-slate-800/90 backdrop-blur-md border-b border-slate-200 dark:border-slate-700 shadow-sm">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3 cursor-pointer" onclick="navigateTo('home')">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-bio-600 to-emerald-400 flex items-center justify-center text-white shadow-md shadow-bio-500/20">
          <i class="fa-solid fa-dna text-xl"></i>
        </div>
        <div>
          <h1 class="text-xl font-bold bg-gradient-to-r from-bio-700 via-bio-600 to-teal-500 bg-clip-text text-transparent leading-tight">PintarBio</h1>
          <p class="text-[10px] text-slate-500 dark:text-slate-400 font-medium" id="headerSubtitle">Biologi KSSM Tingkatan 4 & 5</p>
        </div>
      </div>

      <div class="flex items-center gap-2 sm:gap-3">
        <!-- Language Switcher -->
        <button onclick="toggleLanguage()" class="px-3 py-1.5 rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-100 dark:bg-slate-700/50 hover:bg-slate-200 dark:hover:bg-slate-700 text-xs font-semibold text-slate-700 dark:text-slate-200 flex items-center gap-1.5 transition">
          <i class="fa-solid fa-globe text-bio-600 dark:text-bio-400"></i>
          <span id="langLabel">BM</span>
        </button>

        <!-- Dark Mode Toggle -->
        <button onclick="toggleDarkMode()" class="p-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-100 dark:bg-slate-700/50 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-600 dark:text-amber-400 transition">
          <i id="themeIcon" class="fa-solid fa-moon text-sm"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- MAIN APP CONTAINER -->
  <main id="appContainer" class="flex-grow max-w-6xl w-full mx-auto px-4 py-6">
    <!-- Dynamic Content -->
  </main>

  <!-- BOTTOM NAVIGATION BAR -->
  <nav class="sticky bottom-0 bg-white/95 dark:bg-slate-800/95 backdrop-blur-md border-t border-slate-200 dark:border-slate-700 z-40">
    <div class="max-w-md mx-auto flex justify-around py-2 px-3">
      <button onclick="navigateTo('home')" id="navHome" class="flex flex-col items-center gap-1 text-bio-600 dark:text-bio-400 font-medium">
        <i class="fa-solid fa-house text-lg"></i>
        <span class="text-[11px]" data-i18n="nav_home">Utama</span>
      </button>
      <button onclick="navigateTo('f4')" id="navF4" class="flex flex-col items-center gap-1 text-slate-500 hover:text-bio-600 dark:text-slate-400 transition">
        <i class="fa-solid fa-graduation-cap text-lg"></i>
        <span class="text-[11px]" data-i18n="nav_f4">Ting. 4</span>
      </button>
      <button onclick="navigateTo('f5')" id="navF5" class="flex flex-col items-center gap-1 text-slate-500 hover:text-bio-600 dark:text-slate-400 transition">
        <i class="fa-solid fa-seedling text-lg"></i>
        <span class="text-[11px]" data-i18n="nav_f5">Ting. 5</span>
      </button>
    </div>
  </nav>

  <script>
    let currentLang = localStorage.getItem('pintarbio_lang') || 'bm';
    let isDarkMode = localStorage.getItem('pintarbio_theme') === 'dark';
    let currentView = 'home';
    
    let activeTopic = null;
    let activeCard = null;
    let activeQuiz = [];
    let activeQuestionIndex = 0;
    let quizUserAnswers = [];

    const translations = {
      bm: {
        nav_home: "Utama",
        nav_f4: "Ting. 4",
        nav_f5: "Ting. 5",
        welcome_title: "Selamat Datang ke PintarBio!",
        welcome_sub: "Setiap subtopik mempunyai 1 Flashcard Utama disusuli oleh 5 Soalan Kuiz Pelbagai Format (Pilihan, Betul/Salah, MCQ, Isi Tempat Kosong, dan Padanan).",
        form4_title: "Tingkatan 4 (KSSM)",
        form5_title: "Tingkatan 5 (KSSM)",
        start_study: "Mula Belajar (1 Card + 5 Soalan)",
        active_recall_notice: "⚠️ Mod Active Recall: Pelajari 1 flashcard ini dahulu sebelum menjawab 5 soalan latihan!",
        start_quiz_now: "Mula Jawab 5 Soalan Kuiz ➔",
        question: "Soalan",
        submit: "Hantar Jawapan",
        next_question: "Soalan Seterusnya ➔",
        results_title: "Keputusan Kuiz",
        score: "Markah",
        correct: "Betul",
        revise: "Ulang Semula Flashcard",
        home_btn: "Halaman Utama",
        true_lbl: "BENAR (TRUE)",
        false_lbl: "SALAH (FALSE)",
        type_ph: "Taip jawapan anda di sini...",
        select_match: "-- Pilih Padanan --"
      },
      en: {
        nav_home: "Home",
        nav_f4: "Form 4",
        nav_f5: "Form 5",
        welcome_title: "Welcome to PintarBio!",
        welcome_sub: "Each subtopic features 1 Core Flashcard followed by 5 Multi-Format Quiz Questions (Circle Option, True/False, MCQ, Fill in Blank, & Matching).",
        form4_title: "Form 4 (KSSM)",
        form5_title: "Form 5 (KSSM)",
        start_study: "Start Study (1 Card + 5 Questions)",
        active_recall_notice: "⚠️ Active Recall Mode: Memorize this single flashcard before attempting the 5 quiz questions!",
        start_quiz_now: "Start 5 Quiz Questions ➔",
        question: "Question",
        submit: "Submit Answer",
        next_question: "Next Question ➔",
        results_title: "Quiz Results",
        score: "Score",
        correct: "Correct",
        revise: "Revise Flashcard",
        home_btn: "Home",
        true_lbl: "TRUE",
        false_lbl: "FALSE",
        type_ph: "Type your answer here...",
        select_match: "-- Select Match --"
      }
    };

    // Syllabus Data
    const syllabusData = {
      f4: [
        { id: 'f4_b2', num: 2, title: { bm: 'Biologi Sel dan Organisasi Sel', en: 'Cell Biology and Organisation' }, icon: 'fa-microscope' },
        { id: 'f4_b5', num: 5, title: { bm: 'Metabolisme dan Enzim', en: 'Metabolism and Enzymes' }, icon: 'fa-bolt' }
      ],
      f5: [
        { id: 'f5_b6', num: 6, title: { bm: 'Pewarisan dan Genetik', en: 'Inheritance and Genetics' }, icon: 'fa-dna' }
      ]
    };

    // Database: Exactly 1 Flashcard followed by 5 DIFFERENT TYPES of Questions
    const topicDetailsData = {
      'f4_b2': {
        title: { bm: "2.1 Biologi Sel & Organel", en: "2.1 Cell Biology & Organelles" },
        // SINGLE FLASHCARD
        card: {
          title: { bm: "Komponen Utama Sel & Organel", en: "Main Cell Components & Organelles" },
          desc: { 
            bm: "Sel mengandungi pelbagai organel: Mitokondria menghasilkan tenaga (ATP) melalui respirasi sel. Jasad Golgi mengubah suai dan membungkus protein. JEK mempunyai ribosom untuk sintesis protein, manakala Kloroplas mengandungi klorofil untuk fotosintesis.",
            en: "Cells contain various organelles: Mitochondria produce energy (ATP) via cellular respiration. Golgi apparatus modifies and packages proteins. RER has ribosomes for protein synthesis, while Chloroplast contains chlorophyll for photosynthesis."
          },
          keywords: { bm: ["Mitokondria", "Jasad Golgi", "JEK", "Kloroplas"], en: ["Mitochondria", "Golgi Body", "RER", "Chloroplast"] },
          tip: { bm: "💡 Tip Ingat: Mitokondria = Tenaga | Golgi = Bungkus Protein | JEK = Ribosom | Kloroplas = Fotosintesis", en: "💡 Memory Tip: Mitochondria = Energy | Golgi = Package Protein | RER = Ribosome | Chloroplast = Photosynthesis" }
        },
        // 5 QUESTIONS OF SPECIFIC TYPES
        quiz: [
          // 1. Bulatkan / Pilihan Berkembar
          {
            type: 'circle',
            question: {
              bm: "1. [Soalan Pilihan] Organel yang digelarkan 'powerhouse' sel kerana menjana tenaga ATP ialah:",
              en: "1. [Option Choice] The organelle known as the 'powerhouse' of the cell that generates ATP is:"
            },
            options: {
              bm: ["(A) Mitokondria", "(B) Jasad Golgi"],
              en: ["(A) Mitochondrion", "(B) Golgi Apparatus"]
            },
            answer: 0
          },
          // 2. Betul / Salah
          {
            type: 'tf',
            question: {
              bm: "2. [Betul / Salah] Jalinan Endoplasma Kasar (JEK) mempunyai ribosom yang melekat pada permukaannya.",
              en: "2. [True / False] Rough Endoplasmic Reticulum (RER) has ribosomes attached to its surface."
            },
            answer: true
          },
          // 3. MCQ (Soalan Pelbagai Pilihan Standard)
          {
            type: 'mcq',
            question: {
              bm: "3. [MCQ] Apakah fungsi utama Jasad Golgi dalam sel?",
              en: "3. [MCQ] What is the primary function of the Golgi apparatus in a cell?"
            },
            options: {
              bm: [
                "Menyintesis lipid dan steroid",
                "Mengubah suai, membungkus dan mengangkut protein",
                "Menyerap cahaya matahari untuk fotosintesis",
                "Mencerna bahan buangan sel"
              ],
              en: [
                "Synthesise lipids and steroids",
                "Modify, package, and transport proteins",
                "Absorb sunlight for photosynthesis",
                "Digest cellular waste"
              ]
            },
            answer: 1
          },
          // 4. Isi Tempat Kosong
          {
            type: 'blank',
            question: {
              bm: "4. [Isi Tempat Kosong] Pigmen hijau dalam kloroplas yang berfungsi menyerap cahaya matahari dinamakan __________.",
              en: "4. [Fill in the Blank] The green pigment in chloroplasts responsible for absorbing sunlight is called __________."
            },
            answer: "klorofil"
          },
          // 5. Padanan (Matching)
          {
            type: 'matching',
            question: {
              bm: "5. [Padanan] Padankan organel berikut dengan fungsinya yang betul:",
              en: "5. [Matching] Match the following organelles with their correct functions:"
            },
            pairs: [
              { item: "Mitokondria", target: { bm: "Penjanaan Tenaga ATP", en: "ATP Energy Generation" } },
              { item: "Kloroplas", target: { bm: "Fotosintesis", en: "Photosynthesis" } },
              { item: "Jasad Golgi", target: { bm: "Pembungkusan Protein", en: "Protein Packaging" } }
            ]
          }
        ]
      }
    };

    function t(key) { return translations[currentLang][key] || key; }

    window.addEventListener('DOMContentLoaded', () => {
      applyTheme();
      navigateTo('home');
    });

    function toggleDarkMode() {
      isDarkMode = !isDarkMode;
      localStorage.setItem('pintarbio_theme', isDarkMode ? 'dark' : 'light');
      applyTheme();
    }

    function applyTheme() {
      const icon = document.getElementById('themeIcon');
      if (isDarkMode) {
        document.documentElement.classList.add('dark');
        if (icon) icon.className = 'fa-solid fa-sun text-amber-400';
      } else {
        document.documentElement.classList.remove('dark');
        if (icon) icon.className = 'fa-solid fa-moon text-slate-600';
      }
    }

    function toggleLanguage() {
      currentLang = currentLang === 'bm' ? 'en' : 'bm';
      localStorage.setItem('pintarbio_lang', currentLang);
      document.getElementById('langLabel').textContent = currentLang.toUpperCase();
      renderCurrentView();
    }

    function navigateTo(view, param = null) {
      currentView = view;
      renderCurrentView(param);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function renderCurrentView(param) {
      const app = document.getElementById('appContainer');
      switch (currentView) {
        case 'home': app.innerHTML = renderHome(); break;
        case 'f4': app.innerHTML = renderChapters('f4'); break;
        case 'f5': app.innerHTML = renderChapters('f5'); break;
        case 'flashcard': app.innerHTML = renderFlashcardView(param); break;
        case 'quiz': app.innerHTML = renderQuizView(); break;
        case 'results': app.innerHTML = renderResultsView(); break;
      }
    }

    function renderHome() {
      return `
        <div class="space-y-6">
          <div class="bg-gradient-to-r from-bio-700 via-bio-600 to-teal-600 text-white p-6 sm:p-8 rounded-3xl shadow-xl">
            <h2 class="text-2xl sm:text-3xl font-extrabold mb-2">${t('welcome_title')}</h2>
            <p class="text-sm sm:text-base opacity-90">${t('welcome_sub')}</p>
          </div>
          <div class="grid sm:grid-cols-2 gap-4">
            <button onclick="navigateTo('f4')" class="p-6 bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 text-left card-shadow hover:border-bio-500 transition">
              <i class="fa-solid fa-microscope text-3xl text-bio-600 mb-3"></i>
              <h3 class="text-lg font-bold">${t('form4_title')}</h3>
            </button>
            <button onclick="navigateTo('f5')" class="p-6 bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 text-left card-shadow hover:border-teal-500 transition">
              <i class="fa-solid fa-seedling text-3xl text-teal-600 mb-3"></i>
              <h3 class="text-lg font-bold">${t('form5_title')}</h3>
            </button>
          </div>
        </div>
      `;
    }

    function renderChapters(form) {
      const chapters = syllabusData[form] || [];
      return `
        <div class="space-y-4">
          <h2 class="text-xl font-bold">${form === 'f4' ? t('form4_title') : t('form5_title')}</h2>
          <div class="grid gap-4 sm:grid-cols-2">
            ${chapters.map(ch => `
              <div class="p-5 bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 card-shadow flex items-center justify-between">
                <div>
                  <span class="text-xs font-bold text-bio-600 uppercase">Bab ${ch.num}</span>
                  <h4 class="font-bold text-slate-800 dark:text-white">${ch.title[currentLang]}</h4>
                </div>
                <button onclick="startSession('${ch.id}')" class="px-4 py-2 bg-bio-600 text-white rounded-xl text-xs font-bold shadow hover:bg-bio-700 transition">
                  ${t('start_study')}
                </button>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    function startSession(topicId) {
      const data = topicDetailsData[topicId] || topicDetailsData['f4_b2'];
      activeTopic = { id: topicId, ...data };
      activeCard = data.card;
      activeQuiz = data.quiz;
      activeQuestionIndex = 0;
      quizUserAnswers = [];
      navigateTo('flashcard');
    }

    // 1 FLASHCARD VIEW
    function renderFlashcardView() {
      const cardTitle = activeCard.title[currentLang] || activeCard.title.bm;
      const cardDesc = activeCard.desc[currentLang] || activeCard.desc.bm;
      const cardTip = activeCard.tip[currentLang] || activeCard.tip.bm;

      return `
        <div class="max-w-2xl mx-auto space-y-6">
          <div class="bg-amber-50 dark:bg-amber-950/40 border border-amber-200 text-amber-800 dark:text-amber-200 p-3 rounded-xl text-xs font-medium flex items-center gap-2">
            <i class="fa-solid fa-lightbulb text-amber-500 text-base"></i>
            <span>${t('active_recall_notice')}</span>
          </div>

          <div class="bg-white dark:bg-slate-800 rounded-3xl border-2 border-bio-500/30 p-6 sm:p-8 card-shadow space-y-6">
            <span class="px-3 py-1 bg-bio-100 text-bio-800 dark:bg-bio-900 dark:text-bio-200 text-xs font-bold rounded-full uppercase">1 Flashcard Utama</span>
            <h3 class="text-2xl font-bold text-slate-800 dark:text-white border-b border-slate-100 dark:border-slate-700 pb-2">${cardTitle}</h3>
            <p class="text-slate-600 dark:text-slate-300 text-base leading-relaxed">${cardDesc}</p>
            <div class="p-4 bg-amber-50 dark:bg-amber-950/30 border border-amber-200 rounded-2xl text-amber-900 dark:text-amber-200 text-xs font-medium">
              ${cardTip}
            </div>

            <div class="pt-4 border-t border-slate-100 dark:border-slate-700 flex justify-end">
              <button onclick="navigateTo('quiz')" class="px-6 py-3 bg-bio-600 hover:bg-bio-700 text-white rounded-xl font-bold text-xs shadow-md transition">
                ${t('start_quiz_now')}
              </button>
            </div>
          </div>
        </div>
      `;
    }

    // 5 QUIZ QUESTIONS VIEW
    function renderQuizView() {
      const q = activeQuiz[activeQuestionIndex];
      const total = activeQuiz.length;
      const questionText = q.question[currentLang] || q.question.bm;

      return `
        <div class="max-w-2xl mx-auto space-y-6">
          <div class="flex items-center justify-between">
            <span class="text-xs font-bold text-bio-600 uppercase">Kuiz (Soalan ${activeQuestionIndex + 1} / ${total})</span>
            <div class="w-1/2 bg-slate-200 dark:bg-slate-700 h-2 rounded-full overflow-hidden">
              <div class="bg-bio-500 h-full transition-all" style="width: ${((activeQuestionIndex + 1) / total) * 100}%"></div>
            </div>
          </div>

          <div class="bg-white dark:bg-slate-800 rounded-3xl border border-slate-200 dark:border-slate-700 p-6 sm:p-8 card-shadow space-y-6">
            <h3 class="text-lg font-bold text-slate-800 dark:text-white leading-snug">${questionText}</h3>

            <div id="quizOptionsContainer">
              ${renderQuizOptions(q)}
            </div>

            <div class="pt-4 border-t border-slate-100 dark:border-slate-700 flex justify-end">
              <button onclick="submitQuizAnswer()" id="btnSubmitAnswer" disabled class="px-6 py-2.5 bg-slate-300 dark:bg-slate-700 text-slate-500 rounded-xl font-bold text-xs transition cursor-not-allowed">
                ${t('submit')} <i class="fa-solid fa-check ml-1"></i>
              </button>
            </div>
          </div>
        </div>
      `;
    }

    function renderQuizOptions(q) {
      if (q.type === 'circle' || q.type === 'mcq') {
        const opts = q.options[currentLang] || q.options.bm;
        return opts.map((opt, idx) => `
          <label onclick="enableSubmit()" class="flex items-center gap-3 p-4 mb-3 rounded-2xl border-2 border-slate-200 dark:border-slate-700 hover:border-bio-500 bg-slate-50 dark:bg-slate-900/50 cursor-pointer transition">
            <input type="radio" name="quiz_opt" value="${idx}" class="w-4 h-4 text-bio-600">
            <span class="text-sm font-medium text-slate-700 dark:text-slate-200">${opt}</span>
          </label>
        `).join('');
      } else if (q.type === 'tf') {
        return `
          <div class="grid grid-cols-2 gap-4">
            <label onclick="enableSubmit()" class="flex flex-col items-center p-5 rounded-2xl border-2 border-slate-200 dark:border-slate-700 hover:border-bio-500 bg-slate-50 dark:bg-slate-900/50 cursor-pointer transition">
              <input type="radio" name="quiz_opt" value="true" class="mb-2">
              <span class="text-base font-bold text-bio-600">${t('true_lbl')}</span>
            </label>
            <label onclick="enableSubmit()" class="flex flex-col items-center p-5 rounded-2xl border-2 border-slate-200 dark:border-slate-700 hover:border-red-500 bg-slate-50 dark:bg-slate-900/50 cursor-pointer transition">
              <input type="radio" name="quiz_opt" value="false" class="mb-2">
              <span class="text-base font-bold text-red-600">${t('false_lbl')}</span>
            </label>
          </div>
        `;
      } else if (q.type === 'blank') {
        return `
          <input type="text" id="blankAnswerInput" oninput="enableSubmit()" placeholder="${t('type_ph')}" class="w-full p-4 rounded-2xl border-2 border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-sm focus:border-bio-500 outline-none">
        `;
      } else if (q.type === 'matching') {
        const targets = q.pairs.map(p => p.target[currentLang] || p.target.bm);
        return q.pairs.map((p, idx) => `
          <div class="flex items-center justify-between gap-2 p-3 mb-2 bg-slate-50 dark:bg-slate-900/50 rounded-xl border border-slate-200 dark:border-slate-700">
            <span class="text-xs font-bold text-slate-800 dark:text-slate-200">${p.item}</span>
            <select onchange="enableSubmit()" class="matching-select p-2 rounded-lg text-xs bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-600 outline-none" data-idx="${idx}">
              <option value="">${t('select_match')}</option>
              ${targets.map((tgt, tIdx) => `<option value="${tIdx}">${tgt}</option>`).join('')}
            </select>
          </div>
        `).join('');
      }
    }

    function enableSubmit() {
      const btn = document.getElementById('btnSubmitAnswer');
      if (btn) {
        btn.disabled = false;
        btn.className = "px-6 py-2.5 bg-bio-600 hover:bg-bio-700 text-white rounded-xl font-bold text-xs shadow-md transition cursor-pointer";
      }
    }

    function submitQuizAnswer() {
      const q = activeQuiz[activeQuestionIndex];
      let isCorrect = false;

      if (q.type === 'circle' || q.type === 'mcq') {
        const checked = document.querySelector('input[name="quiz_opt"]:checked');
        if (checked && parseInt(checked.value) === q.answer) isCorrect = true;
      } else if (q.type === 'tf') {
        const checked = document.querySelector('input[name="quiz_opt"]:checked');
        if (checked && (checked.value === 'true') === q.answer) isCorrect = true;
      } else if (q.type === 'blank') {
        const val = document.getElementById('blankAnswerInput').value.trim().toLowerCase();
        if (val === q.answer.toLowerCase()) isCorrect = true;
      } else if (q.type === 'matching') {
        const selects = document.querySelectorAll('.matching-select');
        let allMatched = true;
        selects.forEach(s => {
          const itemIdx = parseInt(s.getAttribute('data-idx'));
          const selectedTgtIdx = parseInt(s.value);
          if (isNaN(selectedTgtIdx) || selectedTgtIdx !== itemIdx) allMatched = false;
        });
        isCorrect = allMatched;
      }

      quizUserAnswers.push(isCorrect);

      if (activeQuestionIndex < activeQuiz.length - 1) {
        activeQuestionIndex++;
        navigateTo('quiz');
      } else {
        navigateTo('results');
      }
    }

    function renderResultsView() {
      const correctCount = quizUserAnswers.filter(Boolean).length;
      const total = quizUserAnswers.length;
      const percentage = Math.round((correctCount / total) * 100);

      return `
        <div class="max-w-md mx-auto text-center space-y-6">
          <div class="bg-white dark:bg-slate-800 rounded-3xl border border-slate-200 dark:border-slate-700 p-8 card-shadow space-y-4">
            <div class="w-16 h-16 mx-auto rounded-full bg-bio-100 text-bio-600 flex items-center justify-center text-2xl font-black">
              <i class="fa-solid fa-trophy"></i>
            </div>
            <h2 class="text-2xl font-extrabold text-slate-800 dark:text-white">${t('results_title')}</h2>
            <div class="p-4 bg-slate-50 dark:bg-slate-900/60 rounded-2xl flex justify-around">
              <div>
                <p class="text-xs text-slate-400">${t('score')}</p>
                <h4 class="text-xl font-bold">${percentage}%</h4>
              </div>
              <div>
                <p class="text-xs text-slate-400">${t('correct')}</p>
                <h4 class="text-xl font-bold text-bio-600">${correctCount} / ${total}</h4>
              </div>
            </div>

            <div class="pt-4 space-y-2">
              <button onclick="navigateTo('flashcard')" class="w-full py-3 bg-bio-600 hover:bg-bio-700 text-white rounded-xl font-bold text-xs shadow transition">
                ${t('revise')}
              </button>
              <button onclick="navigateTo('home')" class="w-full py-3 bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-200 rounded-xl font-bold text-xs transition">
                ${t('home_btn')}
              </button>
            </div>
          </div>
        </div>
      `;
    }
  </script>
</body>
</html>
