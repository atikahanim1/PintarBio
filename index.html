      isDarkMode = !isDarkMode;

      const icon = document.getElementById('themeIcon');
      if (isDarkMode) {
        document.documentElement.classList.add('dark');
        if(icon) icon.className = 'fa-solid fa-sun text-amber-400';

    function navigateTo(view, param = null) {
      currentView = view;
      ['navHome', 'navF4', 'navF5', 'navStats', 'navBadges'].forEach(id => {
        const btn = document.getElementById(id);
        if (btn) btn.className = 'flex flex-col items-center gap-1 text-slate-500 hover:text-bio-600 dark:text-slate-400 dark:hover:text-bio-400 transition';
      });

      if (view === 'home' && document.getElementById('navHome')) document.getElementById('navHome').className = 'flex flex-col items-center gap-1 text-bio-600 dark:text-bio-400 font-semibold';
      if (view === 'f4' && document.getElementById('navF4')) document.getElementById('navF4').className = 'flex flex-col items-center gap-1 text-bio-600 dark:text-bio-400 font-semibold';
      if (view === 'f5' && document.getElementById('navF5')) document.getElementById('navF5').className = 'flex flex-col items-center gap-1 text-bio-600 dark:text-bio-400 font-semibold';
      if (view === 'stats' && document.getElementById('navStats')) document.getElementById('navStats').className = 'flex flex-col items-center gap-1 text-bio-600 dark:text-bio-400 font-semibold';
      if (view === 'badges' && document.getElementById('navBadges')) document.getElementById('navBadges').className = 'flex flex-col items-center gap-1 text-bio-600 dark:text-bio-400 font-semibold';

      renderCurrentView(param);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

      const app = document.getElementById('appContainer');
      switch (currentView) {

        case 'f4':
          app.innerHTML = renderChapters('f4');
          break;
        case 'f5':
          app.innerHTML = renderChapters('f5');
          break;
        case 'flashcards':
          app.innerHTML = renderFlashcardView(param);
          break;
        case 'quiz':
          app.innerHTML = renderQuizView(param);
          break;
        case 'quiz_results':
          app.innerHTML = renderQuizResults();
          break;
        case 'stats':
          app.innerHTML = renderStatsView();
          break;
        case 'badges':
          app.innerHTML = renderBadgesView();
          break;
        case 'search':
          app.innerHTML = renderSearchView();
          break;
        case 'bookmarks':

          break;

    // FLASHCARD VIEW (Bilingual fix for keywords, terms, tip & comparison)
    function startFlashcards(topicId) {
      const data = getTopicData(topicId);
      activeTopic = { id: topicId, ...data };
      activeCards = data.cards;
      activeCardIndex = 0;
      navigateTo('flashcards', topicId);
    }

    function renderFlashcardView(topicId) {
      if (!activeCards || activeCards.length === 0) {
        startFlashcards(topicId);
        return '';
      }

      const card = activeCards[activeCardIndex];
      const total = activeCards.length;
      const topicTitle = activeTopic.title[currentLang] || activeTopic.title.bm;
      const isBookmarked = bookmarks.some(b => b.topicId === activeTopic.id && b.cardIndex === activeCardIndex);

      const cardTitle = typeof card.title === 'object' ? (card.title[currentLang] || card.title.bm) : card.title;
      const cardDesc = typeof card.desc === 'object' ? (card.desc[currentLang] || card.desc.bm) : card.desc;
      const cardTip = typeof card.tip === 'object' ? (card.tip[currentLang] || card.tip.bm) : card.tip;
      const cardComp = card.comparison ? (typeof card.comparison === 'object' ? (card.comparison[currentLang] || card.comparison.bm) : card.comparison) : '';

      const cardKeywords = typeof card.keywords === 'object' && !Array.isArray(card.keywords) 
        ? (card.keywords[currentLang] || card.keywords.bm) 
        : card.keywords;

      const cardTerms = typeof card.terms === 'object' && !Array.isArray(card.terms) 
        ? (card.terms[currentLang] || card.terms.bm) 
        : card.terms;

      return `

          <div class="bg-amber-50 dark:bg-amber-950/40 border border-amber-200 text-amber-800 dark:text-amber-200 p-3 rounded-xl text-xs font-medium flex items-center gap-2">

          </div>

              <span class="text-xs font-bold text-bio-600 dark:text-bio-400 uppercase tracking-wider">${topicTitle}</span>
              <p class="text-sm font-semibold text-slate-700 dark:text-slate-300">Flashcard ${activeCardIndex + 1} / ${total}</p>
            </div>
            <button onclick="toggleBookmark('${activeTopic.id}', ${activeCardIndex})" class="p-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-amber-500 hover:scale-105 transition">
              <i class="${isBookmarked ? 'fa-solid' : 'fa-regular'} fa-bookmark text-lg"></i>
            </button>
          </div>

          <div class="w-full bg-slate-200 dark:bg-slate-700 h-2 rounded-full overflow-hidden">
            <div class="bg-bio-500 h-full transition-all duration-300" style="width: ${((activeCardIndex + 1) / total) * 100}%"></div>
          </div>

          <div class="bg-white dark:bg-slate-800 rounded-3xl border-2 border-bio-500/30 p-6 sm:p-8 card-shadow space-y-6 min-h-[360px] flex flex-col justify-between">
            <div class="space-y-4">
              <h3 class="text-xl sm:text-2xl font-bold text-slate-800 dark:text-white border-b border-slate-100 dark:border-slate-700/80 pb-3 flex items-center justify-between">
                <span>${cardTitle}</span>
                <i class="fa-solid fa-lightbulb text-amber-400 text-xl"></i>
              </h3>

              <p class="text-slate-600 dark:text-slate-300 text-base leading-relaxed">${cardDesc}</p>

              <div class="space-y-2 pt-2">
                <div class="flex flex-wrap gap-1.5">
                  <span class="text-xs font-bold text-slate-500 dark:text-slate-400 mr-1">${t('lbl_keywords')}:</span>
                  ${cardKeywords.map(kw => `<span class="px-2.5 py-0.5 rounded-full bg-bio-50 text-bio-700 dark:bg-bio-950 dark:text-bio-300 text-xs font-semibold border border-bio-200 dark:border-bio-800">${kw}</span>`).join('')}

                <div class="flex flex-wrap gap-1.5">
                  <span class="text-xs font-bold text-slate-500 dark:text-slate-400 mr-1">${t('lbl_terms')}:</span>
                  ${cardTerms.map(tm => `<span class="px-2.5 py-0.5 rounded-full bg-blue-50 text-blue-700 dark:bg-blue-950 dark:text-blue-300 text-xs font-semibold border border-blue-200 dark:border-blue-800 italic">${tm}</span>`).join('')}
                </div>
              </div>

              ${cardComp ? `
                <div class="p-3 bg-slate-50 dark:bg-slate-700/50 rounded-xl text-xs text-slate-600 dark:text-slate-300 border-l-4 border-bio-500">
                  ${cardComp}
                </div>
              ` : ''}

              <div class="p-4 bg-amber-50 dark:bg-amber-950/30 border border-amber-200 dark:border-amber-900/50 rounded-2xl text-amber-900 dark:text-amber-200 text-xs sm:text-sm font-medium">

              <button onclick="navigateTo('home')" class="px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 font-semibold text-xs hover:bg-slate-100 dark:hover:bg-slate-700 transition flex items-center gap-2">
                <i class="fa-solid fa-house"></i> ${t('home_button')}
              </button>

              <button onclick="nextFlashcard()" class="px-6 py-2.5 bg-bio-600 hover:bg-bio-700 text-white rounded-xl font-bold text-xs shadow-md transition flex items-center gap-2">
                ${t('next_card')}
              </button>
            </div>
          </div>
        </div>
      `;
    }

    function nextFlashcard() {
      userStats.cardsRead++;
      localStorage.setItem('pintarbio_stats', JSON.stringify(userStats));

      if (activeCardIndex < activeCards.length - 1) {
        activeCardIndex++;
        navigateTo('flashcards', activeTopic.id);
      } else {
        startQuizDirect(activeTopic.id);
      }
    }

    // QUIZ VIEW
    function startQuizDirect(topicId) {
      const data = getTopicData(topicId);
      activeTopic = { id: topicId, ...data };
      activeQuiz = data.quiz;
      activeQuestionIndex = 0;
      quizUserAnswers = [];
      quizStartTime = Date.now();
      navigateTo('quiz', topicId);
    }

    function renderQuizView(topicId) {
      if (!activeQuiz || activeQuiz.length === 0) {
        startQuizDirect(topicId);
        return '';
      }

      const q = activeQuiz[activeQuestionIndex];
      const total = activeQuiz.length;
      const topicTitle = activeTopic.title[currentLang] || activeTopic.title.bm;

      const questionText = typeof q.question === 'object' ? (q.question[currentLang] || q.question.bm) : q.question;

      return `
        <div class="max-w-2xl mx-auto space-y-6 no-select">
          <div class="bg-red-50 dark:bg-red-950/40 border border-red-200 dark:border-red-800 text-red-800 dark:text-red-200 p-3 rounded-xl text-xs font-medium flex items-center gap-2">

          </div>

              <span class="text-xs font-bold text-bio-600 dark:text-bio-400 uppercase tracking-wider">${topicTitle}</span>

            </div>
          </div>

          <div class="w-full bg-slate-200 dark:bg-slate-700 h-2 rounded-full overflow-hidden">
            <div class="bg-teal-500 h-full transition-all duration-300" style="width: ${((activeQuestionIndex + 1) / total) * 100}%"></div>
          </div>

          <div class="bg-white dark:bg-slate-800 rounded-3xl border border-slate-200 dark:border-slate-700 p-6 sm:p-8 card-shadow space-y-6">
            <h3 class="text-lg sm:text-xl font-bold text-slate-800 dark:text-white leading-snug">${questionText}</h3>

            <div id="quizOptionsContainer" class="space-y-3">
              ${renderQuizOptions(q)}
            </div>

            <div class="pt-4 border-t border-slate-100 dark:border-slate-700 flex justify-end">
              <button onclick="submitQuizAnswer()" id="btnSubmitAnswer" disabled class="px-6 py-2.5 bg-slate-300 dark:bg-slate-700 text-slate-500 dark:text-slate-400 rounded-xl font-bold text-xs transition cursor-not-allowed flex items-center gap-2">
                ${t('submit')} <i class="fa-solid fa-check"></i>
              </button>
            </div>
          </div>
        </div>
      `;
    }

    function renderQuizOptions(q) {
      if (q.type === 'mcq') {
        const optionsList = typeof q.options === 'object' && !Array.isArray(q.options) 
          ? (q.options[currentLang] || q.options.bm) 
          : q.options;

        return optionsList.map((opt, idx) => `
          <label onclick="enableSubmit()" class="flex items-center gap-3 p-4 rounded-2xl border-2 border-slate-200 dark:border-slate-700 hover:border-bio-500 dark:hover:border-bio-400 bg-slate-50 dark:bg-slate-900/50 cursor-pointer transition">
            <input type="radio" name="quiz_opt" value="${idx}" class="w-4 h-4 text-bio-600 focus:ring-bio-500">
            <span class="text-sm font-medium text-slate-700 dark:text-slate-200">${opt}</span>
          </label>
        `).join('');
      } else if (q.type === 'tf') {
        return `
          <div class="grid grid-cols-2 gap-4">
            <label onclick="enableSubmit()" class="flex flex-col items-center justify-center p-5 rounded-2xl border-2 border-slate-200 dark:border-slate-700 hover:border-bio-500 bg-slate-50 dark:bg-slate-900/50 cursor-pointer transition text-center">
              <input type="radio" name="quiz_opt" value="true" class="mb-2 w-4 h-4 text-bio-600">
              <span class="text-base font-bold text-bio-600 dark:text-bio-400">${t('true_lbl')}</span>
            </label>
            <label onclick="enableSubmit()" class="flex flex-col items-center justify-center p-5 rounded-2xl border-2 border-slate-200 dark:border-slate-700 hover:border-red-500 bg-slate-50 dark:bg-slate-900/50 cursor-pointer transition text-center">
              <input type="radio" name="quiz_opt" value="false" class="mb-2 w-4 h-4 text-red-600">
              <span class="text-base font-bold text-red-600 dark:text-red-400">${t('false_lbl')}</span>
            </label>
          </div>
        `;
      } else if (q.type === 'blank') {
        return `
          <div class="space-y-2">
            <input type="text" id="blankAnswerInput" oninput="enableSubmit()" placeholder="${t('type_placeholder')}" class="w-full p-4 rounded-2xl border-2 border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-sm focus:border-bio-500 outline-none transition">
          </div>
        `;
      }
    }

    function enableSubmit() {
      const btn = document.getElementById('btnSubmitAnswer');
      if (btn) {
        btn.disabled = false;
        btn.className = "px-6 py-2.5 bg-bio-600 hover:bg-bio-700 text-white rounded-xl font-bold text-xs shadow-md transition cursor-pointer flex items-center gap-2";
      }
    }

    function submitQuizAnswer() {
      const q = activeQuiz[activeQuestionIndex];
      let selectedVal = null;

      if (q.type === 'mcq') {
        const checked = document.querySelector('input[name="quiz_opt"]:checked');
        if (checked) selectedVal = parseInt(checked.value);
      } else if (q.type === 'tf') {
        const checked = document.querySelector('input[name="quiz_opt"]:checked');
        if (checked) selectedVal = checked.value === 'true';
      } else if (q.type === 'blank') {
        const val = document.getElementById('blankAnswerInput').value.trim();
        selectedVal = val.toLowerCase();
      }

      let isCorrect = false;
      if (q.type === 'mcq') {
        isCorrect = selectedVal === q.answer;
      } else if (q.type === 'tf') {
        isCorrect = selectedVal === q.answer;
      } else if (q.type === 'blank') {
        const targetAns = typeof q.answer === 'object' ? (q.answer[currentLang] || q.answer.bm) : q.answer;
        isCorrect = selectedVal === targetAns.toLowerCase();
      }

      quizUserAnswers.push({
        question: typeof q.question === 'object' ? q.question[currentLang] : q.question,
        userAnswer: selectedVal,
        isCorrect: isCorrect
      });

      if (activeQuestionIndex < activeQuiz.length - 1) {
        activeQuestionIndex++;
        navigateTo('quiz', activeTopic.id);
      } else {
        finishQuiz();
      }
    }

    function finishQuiz() {
      const correctCount = quizUserAnswers.filter(a => a.isCorrect).length;
      const total = quizUserAnswers.length;
      const percentage = Math.round((correctCount / total) * 100);

      userStats.quizzesCompleted++;
      userStats.totalScore += percentage;
      userStats.lastScore = percentage;

      if (percentage >= 60 && !userStats.completedTopics.includes(activeTopic.id)) {
        userStats.completedTopics.push(activeTopic.id);
      }

      localStorage.setItem('pintarbio_stats', JSON.stringify(userStats));
      navigateTo('quiz_results');
    }

    // QUIZ RESULTS VIEW
    function renderQuizResults() {
      const correctCount = quizUserAnswers.filter(a => a.isCorrect).length;
      const total = quizUserAnswers.length;
      const percentage = Math.round((correctCount / total) * 100);
      const timeSpentSec = Math.round((Date.now() - quizStartTime) / 1000);

      return `
        <div class="max-w-xl mx-auto space-y-6 text-center">
          <div class="bg-white dark:bg-slate-800 rounded-3xl border border-slate-200 dark:border-slate-700 p-8 card-shadow space-y-6">
            <div class="w-20 h-20 mx-auto rounded-3xl bg-bio-100 dark:bg-bio-950 text-bio-600 dark:text-bio-400 flex items-center justify-center text-3xl shadow-inner">
              <i class="fa-solid fa-trophy"></i>
            </div>

            <div>
              <h2 class="text-3xl font-extrabold text-slate-800 dark:text-white">${t('results_title')}</h2>
            </div>

            <div class="grid grid-cols-3 gap-3 p-4 bg-slate-50 dark:bg-slate-900/60 rounded-2xl">
              <div>
                <p class="text-[11px] text-slate-500 dark:text-slate-400 font-medium">${t('score')}</p>
                <h4 class="text-2xl font-black text-slate-800 dark:text-white">${percentage}%</h4>
              </div>
              <div>
                <p class="text-[11px] text-slate-500 dark:text-slate-400 font-medium">Betul</p>
                <h4 class="text-2xl font-black text-bio-600 dark:text-bio-400">${correctCount} / ${total}</h4>
              </div>
              <div>
                <p class="text-[11px] text-slate-500 dark:text-slate-400 font-medium">${t('time_taken')}</p>
                <h4 class="text-2xl font-black text-slate-800 dark:text-white">${timeSpentSec}s</h4>
              </div>
            </div>

            <div class="pt-2 flex flex-col sm:flex-row items-center gap-3">
              <button onclick="startFlashcards('${activeTopic.id}')" class="w-full py-3 bg-bio-600 hover:bg-bio-700 text-white rounded-xl font-bold text-xs shadow-md transition flex items-center justify-center gap-2">
                <i class="fa-solid fa-rotate-right"></i> ${t('revise_flashcards')}
              </button>
              <button onclick="navigateTo('home')" class="w-full py-3 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 rounded-xl font-bold text-xs transition flex items-center justify-center gap-2">
                <i class="fa-solid fa-house"></i> ${t('continue_learning')}
              </button>
            </div>
          </div>
        </div>
      `;
    }

    // STATS VIEW
    function renderStatsView() {
      const avgScore = userStats.quizzesCompleted > 0 ? Math.round(userStats.totalScore / userStats.quizzesCompleted) : 0;

      return `
        <div class="max-w-3xl mx-auto space-y-6">
          <h2 class="text-2xl font-bold text-slate-800 dark:text-white border-b border-slate-200 dark:border-slate-700 pb-3">
            <i class="fa-solid fa-chart-pie text-bio-600"></i> ${t('nav_stats')}
          </h2>

          <div class="grid grid-cols-2 sm:grid-cols-3 gap-4">
            <div class="bg-white dark:bg-slate-800 p-5 rounded-2xl border border-slate-200 dark:border-slate-700 card-shadow text-center">
              <i class="fa-solid fa-check-circle text-bio-500 text-2xl mb-2"></i>
              <p class="text-xs text-slate-500 dark:text-slate-400">${t('stats_completed_topics')}</p>
              <h3 class="text-2xl font-black text-slate-800 dark:text-white mt-1">${userStats.completedTopics.length}</h3>
            </div>
            <div class="bg-white dark:bg-slate-800 p-5 rounded-2xl border border-slate-200 dark:border-slate-700 card-shadow text-center">
              <i class="fa-solid fa-clone text-blue-500 text-2xl mb-2"></i>
              <p class="text-xs text-slate-500 dark:text-slate-400">${t('stats_cards_read')}</p>
              <h3 class="text-2xl font-black text-slate-800 dark:text-white mt-1">${userStats.cardsRead}</h3>
            </div>
            <div class="bg-white dark:bg-slate-800 p-5 rounded-2xl border border-slate-200 dark:border-slate-700 card-shadow text-center">
              <i class="fa-solid fa-vial text-purple-500 text-2xl mb-2"></i>
              <p class="text-xs text-slate-500 dark:text-slate-400">${t('stats_quizzes')}</p>
              <h3 class="text-2xl font-black text-slate-800 dark:text-white mt-1">${userStats.quizzesCompleted}</h3>
            </div>
          </div>
        </div>
      `;
    }

    // BADGES VIEW
    function renderBadgesView() {
      return `
        <div class="max-w-3xl mx-auto space-y-6">
          <h2 class="text-2xl font-bold text-slate-800 dark:text-white border-b border-slate-200 dark:border-slate-700 pb-3">
            <i class="fa-solid fa-award text-amber-500"></i> ${t('nav_badges')}
          </h2>

          <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
            ${badgesList.map(b => {
              const unlocked = b.req(userStats);
              return `
                <div class="bg-white dark:bg-slate-800 p-5 rounded-2xl border ${unlocked ? 'border-amber-400/60 shadow-lg shadow-amber-500/10' : 'border-slate-200 dark:border-slate-700 opacity-60'} card-shadow flex flex-col items-center text-center">
                  <div class="w-16 h-16 rounded-2xl ${unlocked ? b.color : 'bg-slate-300 dark:bg-slate-700'} text-white flex items-center justify-center text-2xl mb-3 shadow-md">
                    <i class="fa-solid ${b.icon}"></i>
                  </div>
                  <h4 class="font-bold text-slate-800 dark:text-white text-sm">${b.name}</h4>
                  <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">${b.desc}</p>
                  <span class="mt-3 px-3 py-0.5 rounded-full text-[10px] font-bold uppercase tracking-wider ${unlocked ? 'bg-amber-100 text-amber-800 dark:bg-amber-950 dark:text-amber-300' : 'bg-slate-100 text-slate-500 dark:bg-slate-700 dark:text-slate-400'}">
                    ${unlocked ? t('badge_unlocked') : t('badge_locked')}
                  </span>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    // SEARCH VIEW
    function renderSearchView() {
      return `
        <div class="max-w-2xl mx-auto space-y-6">
          <div class="relative">
            <i class="fa-solid fa-magnifying-glass absolute left-4 top-4 text-slate-400 text-lg"></i>
            <input type="text" id="searchInput" oninput="handleSearch()" placeholder="${t('search_placeholder')}" class="w-full pl-12 pr-4 py-3.5 rounded-2xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-800 dark:text-white text-sm focus:border-bio-500 outline-none card-shadow transition">
          </div>
          <div id="searchResults" class="space-y-3"></div>
        </div>
      `;
    }

    function handleSearch() {
      const query = document.getElementById('searchInput').value.toLowerCase().trim();
      const resultsContainer = document.getElementById('searchResults');
      if (!query) { resultsContainer.innerHTML = ''; return; }

      let matches = [];
      ['f4', 'f5'].forEach(form => {
        syllabusData[form].forEach(ch => {
          if (ch.title.bm.toLowerCase().includes(query) || ch.title.en.toLowerCase().includes(query)) {
            matches.push({ ...ch, form });
          }
        });
      });

      resultsContainer.innerHTML = matches.map(m => `
        <div onclick="startFlashcards('${m.id}')" class="p-4 bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 card-shadow hover:border-bio-500 cursor-pointer transition flex items-center justify-between">
          <h4 class="text-sm font-bold text-slate-800 dark:text-white">${m.title[currentLang] || m.title.bm}</h4>
          <i class="fa-solid fa-chevron-right text-slate-400 text-xs"></i>
        </div>
      `).join('');
    }

    // BOOKMARKS
    function toggleBookmark(topicId, cardIndex) {
      const index = bookmarks.findIndex(b => b.topicId === topicId && b.cardIndex === cardIndex);
      if (index > -1) {
        bookmarks.splice(index, 1);
      } else {
        bookmarks.push({ topicId, cardIndex });
      }
      localStorage.setItem('pintarbio_bookmarks', JSON.stringify(bookmarks));
      updateBookmarkBadge();
      renderCurrentView(topicId);
    }

    function updateBookmarkBadge() {
      const badge = document.getElementById('bookmarkBadge');
      if (badge) {
        if (bookmarks.length > 0) {
          badge.textContent = bookmarks.length;
          badge.classList.remove('hidden');
        } else {
          badge.classList.add('hidden');
        }
      }
    }

    function renderBookmarksView() {
      if (bookmarks.length === 0) {
        return `<div class="text-center py-12">${t('no_bookmarks')}</div>`;
      }
      return `<div class="max-w-2xl mx-auto space-y-4">Bookmarks Saved: ${bookmarks.length}</div>`;
    }
  </script>
</body>
</html>
