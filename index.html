        quiz: [
          {
            type: 'tf',
            question: { bm: "Teknik Active Recall terbukti meningkatkan ingatan jangka panjang.", en: "Active Recall is proven to enhance long-term memory." },
            answer: true
          }
        ]
      };
    }

    const badgesList = [
      { id: 'b1', name: 'Biology Beginner', desc: 'Selesaikan 1 subtopik pertama', icon: 'fa-seedling', color: 'bg-green-500', req: stats => stats.completedTopics.length >= 1 },
      { id: 'b2', name: 'Cell Master', desc: 'Selesaikan Bab 2 Tingkatan 4', icon: 'fa-microscope', color: 'bg-blue-500', req: stats => stats.completedTopics.includes('f4_b2') }
    ];

    window.addEventListener('DOMContentLoaded', () => {
      applyTheme();
      updateBookmarkBadge();
      navigateTo('home');
    });

    function toggleDarkMode() {
      isDarkMode = !isDarkMode;
      localStorage.setItem('pintarbio_theme', isDarkMode ? 'dark' : 'light');
      applyTheme();
    }

    function applyTheme() {
      const icon = document.getElementById('themeIcon');
      if (isDarkMode) {
        document.documentElement.classList.add('dark');
        if (icon) icon.className = 'fa-solid fa-sun text-amber-400';
      } else {
        document.documentElement.classList.remove('dark');
        if (icon) icon.className = 'fa-solid fa-moon text-slate-600';
      }
    }

    function toggleLanguage() {
      currentLang = currentLang === 'bm' ? 'en' : 'bm';
      localStorage.setItem('pintarbio_lang', currentLang);
      document.getElementById('langLabel').textContent = currentLang.toUpperCase();
      renderCurrentView();
    }

    function t(key) { return translations[currentLang][key] || key; }

    function navigateTo(view, param = null) {
      currentView = view;
      renderCurrentView(param);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function renderCurrentView(param) {
      const app = document.getElementById('appContainer');
      switch (currentView) {
        case 'home': app.innerHTML = renderHome(); break;
        case 'f4': app.innerHTML = renderChapters('f4'); break;
        case 'f5': app.innerHTML = renderChapters('f5'); break;
        case 'flashcards': app.innerHTML = renderFlashcardView(param); break;
        case 'quiz': app.innerHTML = renderQuizView(param); break;
        case 'quiz_results': app.innerHTML = renderQuizResults(); break;
        case 'stats': app.innerHTML = renderStatsView(); break;
        case 'badges': app.innerHTML = renderBadgesView(); break;
        case 'search': app.innerHTML = renderSearchView(); break;
        case 'bookmarks': app.innerHTML = renderBookmarksView(); break;
      }
    }

    function renderHome() {
      return `
        <div class="space-y-6">
          <div class="relative overflow-hidden rounded-3xl bg-gradient-to-r from-bio-700 via-bio-600 to-teal-600 text-white p-6 sm:p-8 shadow-xl">
            <h2 class="text-2xl sm:text-4xl font-extrabold mb-2 leading-tight">${t('welcome_title')}</h2>
            <p class="text-bio-50 text-sm opacity-95">${t('welcome_sub')}</p>
            <div class="mt-6 flex gap-3">
              <button onclick="navigateTo('f4')" class="px-5 py-2.5 bg-white text-bio-800 rounded-xl font-bold shadow-md hover:bg-bio-50 transition text-sm flex items-center gap-2">
                <i class="fa-solid fa-book-open"></i> ${t('form4_title')}
              </button>
              <button onclick="navigateTo('f5')" class="px-5 py-2.5 bg-bio-900/40 border border-white/30 text-white rounded-xl font-bold shadow-md hover:bg-bio-900/60 transition text-sm flex items-center gap-2">
                <i class="fa-solid fa-graduation-cap"></i> ${t('form5_title')}
              </button>
            </div>
          </div>
        </div>
      `;
    }

    function renderChapters(form) {
      const chapters = syllabusData[form];
      return `
        <div class="space-y-4">
          <div class="flex items-center justify-between border-b border-slate-200 dark:border-slate-700 pb-3">
            <h2 class="text-2xl font-bold text-slate-800 dark:text-white">${form === 'f4' ? t('form4_title') : t('form5_title')}</h2>
            <button onclick="navigateTo('home')" class="px-3 py-1.5 text-xs rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800 transition">
              <i class="fa-solid fa-arrow-left"></i> Kembali
            </button>
          </div>
          <div class="grid gap-4 sm:grid-cols-2">
            ${chapters.map(ch => `
              <div class="bg-white dark:bg-slate-800 rounded-2xl p-5 border border-slate-200 dark:border-slate-700 card-shadow">
                <span class="text-[11px] font-semibold uppercase text-bio-600 dark:text-bio-400">Bab ${ch.num}</span>
                <h3 class="font-bold text-base text-slate-800 dark:text-white mb-3">${ch.title[currentLang] || ch.title.bm}</h3>
                <div class="flex gap-2">
                  <button onclick="startFlashcards('${ch.id}')" class="flex-1 py-2 bg-bio-600 hover:bg-bio-700 text-white rounded-xl text-xs font-semibold shadow-sm transition">
                    ${t('start_flashcard')}
                  </button>
                  <button onclick="startQuizDirect('${ch.id}')" class="py-2 px-3 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 rounded-xl text-xs font-semibold transition">
                    Kuiz
                  </button>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    function startFlashcards(topicId) {
      const data = getTopicData(topicId);
      activeTopic = { id: topicId, ...data };
      activeCards = data.cards;
      activeCardIndex = 0;
      navigateTo('flashcards', topicId);
    }

    function renderFlashcardView(topicId) {
      if (!activeCards || activeCards.length === 0) { startFlashcards(topicId); return ''; }
      const card = activeCards[activeCardIndex];
      const topicTitle = activeTopic.title[currentLang] || activeTopic.title.bm;

      const cardTitle = typeof card.title === 'object' ? (card.title[currentLang] || card.title.bm) : card.title;
      const cardDesc = typeof card.desc === 'object' ? (card.desc[currentLang] || card.desc.bm) : card.desc;
      const cardTip = typeof card.tip === 'object' ? (card.tip[currentLang] || card.tip.bm) : card.tip;
      const cardComp = card.comparison ? (typeof card.comparison === 'object' ? (card.comparison[currentLang] || card.comparison.bm) : card.comparison) : null;

      const keywordsList = card.keywords ? (typeof card.keywords === 'object' && !Array.isArray(card.keywords) ? card.keywords[currentLang] : card.keywords) : [];
      const termsList = card.terms ? (typeof card.terms === 'object' && !Array.isArray(card.terms) ? card.terms[currentLang] : card.terms) : [];

      return `
        <div class="max-w-2xl mx-auto space-y-4 no-select">
          <div class="bg-amber-50 dark:bg-amber-950/40 border border-amber-200 dark:border-amber-800 text-amber-800 dark:text-amber-200 p-3 rounded-xl text-xs font-medium flex items-center gap-2">
            <i class="fa-solid fa-triangle-exclamation text-amber-500 text-base flex-shrink-0"></i>
            <span>${t('active_recall_notice')}</span>
          </div>

          <div class="flex items-center justify-between">
            <span class="text-xs font-bold text-bio-600 dark:text-bio-400 uppercase">${topicTitle}</span>
            <p class="text-xs font-semibold text-slate-500">Flashcard ${activeCardIndex + 1} / ${activeCards.length}</p>
          </div>

          <div class="bg-white dark:bg-slate-800 rounded-3xl border-2 border-bio-500/30 p-6 card-shadow space-y-4">
            <h3 class="text-xl font-bold text-slate-800 dark:text-white border-b border-slate-100 dark:border-slate-700 pb-2">${cardTitle}</h3>

            <!-- DYNAMIC SVG DIAGRAM (Passing currentLang into function) -->
            ${card.image ? `<div class="my-2">${typeof card.image === 'function' ? card.image(currentLang) : card.image}</div>` : ''}

            <p class="text-slate-600 dark:text-slate-300 leading-relaxed text-sm">${cardDesc}</p>

            <div class="space-y-2 pt-1">
              ${keywordsList.length ? `
                <div class="flex flex-wrap gap-1.5 items-center">
                  <span class="text-xs font-bold text-slate-500 dark:text-slate-400">${t('lbl_keywords')}:</span>
                  ${keywordsList.map(kw => `<span class="px-2.5 py-0.5 rounded-full bg-bio-50 text-bio-700 dark:bg-bio-950 dark:text-bio-300 text-xs font-semibold border border-bio-200 dark:border-bio-800">${kw}</span>`).join('')}
                </div>
              ` : ''}
              ${termsList.length ? `
                <div class="flex flex-wrap gap-1.5 items-center">
                  <span class="text-xs font-bold text-slate-500 dark:text-slate-400">${t('lbl_terms')}:</span>
                  ${termsList.map(tm => `<span class="px-2.5 py-0.5 rounded-full bg-blue-50 text-blue-700 dark:bg-blue-950 dark:text-blue-300 text-xs font-semibold border border-blue-200 dark:border-blue-800 italic">${tm}</span>`).join('')}
                </div>
              ` : ''}
            </div>

            ${cardComp ? `
              <div class="p-3 bg-slate-50 dark:bg-slate-700/50 rounded-xl text-xs text-slate-600 dark:text-slate-300 border-l-4 border-bio-500">
                ${cardComp}
              </div>
            ` : ''}

            <div class="p-3 bg-amber-50 dark:bg-amber-950/30 rounded-xl text-xs font-medium text-amber-800 dark:text-amber-200">
              ${cardTip}
            </div>

            <div class="flex justify-between items-center pt-4 border-t border-slate-100 dark:border-slate-700">
              <button onclick="navigateTo('home')" class="px-4 py-2 border border-slate-200 dark:border-slate-700 rounded-xl text-xs font-semibold">${t('home_button')}</button>
              <button onclick="nextFlashcard()" class="px-6 py-2 bg-bio-600 hover:bg-bio-700 text-white rounded-xl text-xs font-bold shadow-md">${t('next_card')}</button>
            </div>
          </div>
        </div>
      `;
    }

    function nextFlashcard() {
      userStats.cardsRead++;
      localStorage.setItem('pintarbio_stats', JSON.stringify(userStats));
      if (activeCardIndex < activeCards.length - 1) {
        activeCardIndex++;
        navigateTo('flashcards', activeTopic.id);
      } else {
        startQuizDirect(activeTopic.id);
      }
    }

    function startQuizDirect(topicId) {
      const data = getTopicData(topicId);
      activeTopic = { id: topicId, ...data };
      activeQuiz = data.quiz;
      activeQuestionIndex = 0;
      quizUserAnswers = [];
      quizStartTime = Date.now();
      navigateTo('quiz', topicId);
    }

    function renderQuizView(topicId) {
      if (!activeQuiz || activeQuiz.length === 0) { startQuizDirect(topicId); return ''; }
      const q = activeQuiz[activeQuestionIndex];
      const qText = typeof q.question === 'object' ? (q.question[currentLang] || q.question.bm) : q.question;

      return `
        <div class="max-w-2xl mx-auto space-y-4 no-select">
          <div class="bg-red-50 dark:bg-red-950/40 border border-red-200 dark:border-red-800 text-red-800 dark:text-red-200 p-3 rounded-xl text-xs font-medium flex items-center gap-2">
            <i class="fa-solid fa-lock text-red-500 text-base flex-shrink-0"></i>
            <span>${t('quiz_warning')}</span>
          </div>

          <div class="bg-white dark:bg-slate-800 rounded-3xl p-6 border border-slate-200 dark:border-slate-700 card-shadow space-y-4">
            <!-- DYNAMIC QUIZ SVG DIAGRAM (Passing currentLang) -->
            ${q.image ? `<div class="my-2">${typeof q.image === 'function' ? q.image(currentLang) : q.image}</div>` : ''}

            <h3 class="text-base font-bold text-slate-800 dark:text-white leading-snug">${qText}</h3>
            
            <div id="quizOptionsContainer" class="space-y-2">
              ${renderQuizOptions(q)}
            </div>

            <div class="pt-4 border-t border-slate-100 dark:border-slate-700 flex justify-end">
              <button onclick="submitQuizAnswer()" id="btnSubmitAnswer" disabled class="px-6 py-2.5 bg-slate-300 dark:bg-slate-700 text-slate-500 rounded-xl font-bold text-xs transition cursor-not-allowed">
                ${t('submit')}
              </button>
            </div>
          </div>
        </div>
      `;
    }

    function renderQuizOptions(q) {
      const opts = typeof q.options === 'object' && !Array.isArray(q.options) ? (q.options[currentLang] || q.options.bm) : q.options;
      return opts.map((opt, idx) => `
        <label onclick="enableSubmit()" class="flex items-center gap-3 p-3.5 rounded-2xl border-2 border-slate-200 dark:border-slate-700 hover:border-bio-500 bg-slate-50 dark:bg-slate-900/50 cursor-pointer transition text-xs font-medium">
          <input type="radio" name="quiz_opt" value="${idx}" class="w-4 h-4 text-bio-600">
          <span class="text-slate-700 dark:text-slate-200">${opt}</span>
        </label>
      `).join('');
    }

    function enableSubmit() {
      const btn = document.getElementById('btnSubmitAnswer');
      if (btn) {
        btn.disabled = false;
        btn.className = "px-6 py-2.5 bg-bio-600 hover:bg-bio-700 text-white rounded-xl font-bold text-xs shadow-md cursor-pointer transition";
      }
    }

    function submitQuizAnswer() {
      const q = activeQuiz[activeQuestionIndex];
      const checked = document.querySelector('input[name="quiz_opt"]:checked');
      const selectedVal = checked ? parseInt(checked.value) : null;
      
      quizUserAnswers.push({ isCorrect: selectedVal === q.answer });

      if (activeQuestionIndex < activeQuiz.length - 1) {
        activeQuestionIndex++;
        navigateTo('quiz', activeTopic.id);
      } else {
        finishQuiz();
      }
    }

    function finishQuiz() {
      const correctCount = quizUserAnswers.filter(a => a.isCorrect).length;
      const total = quizUserAnswers.length;
      const percentage = Math.round((correctCount / total) * 100);

      userStats.quizzesCompleted++;
      userStats.totalScore += percentage;
      userStats.lastScore = percentage;

      if (percentage >= 60 && !userStats.completedTopics.includes(activeTopic.id)) {
        userStats.completedTopics.push(activeTopic.id);
      }

      localStorage.setItem('pintarbio_stats', JSON.stringify(userStats));
      navigateTo('quiz_results');
    }

    function renderQuizResults() {
      const correctCount = quizUserAnswers.filter(a => a.isCorrect).length;
      const total = quizUserAnswers.length;
      const percentage = Math.round((correctCount / total) * 100);

      return `
        <div class="max-w-xl mx-auto text-center space-y-6 p-8 bg-white dark:bg-slate-800 rounded-3xl border border-slate-200 dark:border-slate-700 card-shadow">
          <h2 class="text-3xl font-extrabold text-slate-800 dark:text-white">${t('results_title')}</h2>
          <div class="text-4xl font-black text-bio-600 dark:text-bio-400">${percentage}%</div>
          <p class="text-sm text-slate-500">${correctCount} / ${total} Betul</p>
          <div class="pt-2 flex gap-3">
            <button onclick="startFlashcards('${activeTopic.id}')" class="flex-1 py-3 bg-bio-600 text-white rounded-xl font-bold text-xs shadow-md">
              ${t('revise_flashcards')}
            </button>
            <button onclick="navigateTo('home')" class="flex-1 py-3 bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-200 rounded-xl font-bold text-xs">
              ${t('continue_learning')}
            </button>
          </div>
        </div>
      `;
    }

    function renderStatsView() { return `<div class="text-center py-12 font-bold text-slate-600 dark:text-slate-300">Statistik Pembelajaran</div>`; }
    function renderBadgesView() { return `<div class="text-center py-12 font-bold text-slate-600 dark:text-slate-300">Lencana Pencapaian</div>`; }
    function renderSearchView() { return `<div class="text-center py-12 font-bold text-slate-600 dark:text-slate-300">Carian Subtopik</div>`; }
    function renderBookmarksView() { return `<div class="text-center py-12 font-bold text-slate-600 dark:text-slate-300">${t('no_bookmarks')}</div>`; }

    function updateBookmarkBadge() {
      const badge = document.getElementById('bookmarkBadge');
      if (badge) {
        if (bookmarks.length > 0) {
          badge.textContent = bookmarks.length;
          badge.classList.remove('hidden');
        } else {
          badge.classList.add('hidden');
        }
      }
    }
  </script>
</body>
</html>
